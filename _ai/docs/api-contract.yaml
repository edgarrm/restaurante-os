# api-contract.yaml — restaurante-os
#
# Nota (ver ADR-001): esta app es un monolito Inertia, no una API JSON pública.
# Cada "response" documentada aquí es un componente Inertia + sus props — se
# modela en formato OpenAPI por consistencia con otros stacks de la skill, usando
# la extensión x-inertia-component para el nombre del componente Vue renderizado.
# Autenticación: sesión de Fortify (cookie), no Bearer token — no hay cliente
# externo consumiendo esto como API real (ver ADR-001, Opción C rechazada).

openapi: 3.0.0
info:
  title: restaurante-os
  version: 0.1.0-mvp
  description: >
    Rutas Inertia del MVP. Cubre las épicas Must Have del PRD; las rutas Should
    (inventario) están documentadas de forma más breve.

servers:
  - url: /

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
  schemas:
    Table:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: "Mesa 4" }
        capacity: { type: integer }
        status: { type: string, enum: [libre, ocupada, por_cobrar] }
    MenuItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        price: { type: number, format: decimal }
        available: { type: boolean }
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        menu_item_id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        unit_price: { type: number, format: decimal }
        status: { type: string, enum: [pendiente, preparando, listo, servido] }
    Order:
      type: object
      properties:
        id: { type: integer }
        table_id: { type: integer }
        status:
          type: string
          enum: [abierta, enviada_cocina, lista, por_cobrar, pagada, cancelada]
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        total: { type: number, format: decimal }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

paths:
  /mesas:
    get:
      summary: Mapa de mesas (US-1.1)
      description: >
        Sondeado por el cliente vía Inertia poll() cada 3-5s (ver ADR-005) para
        reflejar cambios de estado casi en tiempo real.
      responses:
        "200":
          description: Componente de mapa de mesas
          x-inertia-component: Mesas/Index
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items: { $ref: "#/components/schemas/Table" }

  /mesas/{table}/pedido:
    get:
      summary: Toma de pedido de una mesa (US-1.2)
      parameters:
        - name: table
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Componente de toma de pedido
          x-inertia-component: Mesas/Pedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  table: { $ref: "#/components/schemas/Table" }
                  menuItems:
                    type: array
                    items: { $ref: "#/components/schemas/MenuItem" }
                  order: { $ref: "#/components/schemas/Order" }

  /mesas/{table}/pedido/items:
    post:
      summary: Agregar ítem a la orden abierta de la mesa (US-1.2)
      parameters:
        - name: table
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_item_id, quantity]
              properties:
                menu_item_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Orden actualizada (redirect Inertia a la misma página)
          x-inertia-component: Mesas/Pedido
        "422":
          description: Ítem no disponible o cantidad inválida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /mesas/{table}/pedido/enviar:
    post:
      summary: Enviar orden a cocina (US-1.3)
      parameters:
        - name: table
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Orden marcada `enviada_cocina`; ítems visibles en /cocina
          x-inertia-component: Mesas/Pedido
        "422":
          description: Orden sin ítems — no se puede enviar vacía
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /cocina:
    get:
      summary: Vista de cocina / KDS (US-2.1)
      description: Sondeado cada 3-5s (ver ADR-005). Solo accesible a role=cocina o admin.
      responses:
        "200":
          description: Componente KDS
          x-inertia-component: Cocina/Index
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }

  /cocina/items/{orderItem}/listo:
    patch:
      summary: Marcar ítem de orden como listo (US-2.2)
      parameters:
        - name: orderItem
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ítem actualizado a status=listo
          x-inertia-component: Cocina/Index

  /mesas/{table}/cobro:
    get:
      summary: Pantalla de cobro (US-3.1)
      parameters:
        - name: table
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Componente de cobro
          x-inertia-component: Mesas/Cobro
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
    post:
      summary: Aplicar pago y cerrar orden (US-3.1)
      parameters:
        - name: table
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number, format: decimal }
                method: { type: string, example: "efectivo" }
      responses:
        "200":
          description: Orden marcada `pagada`, mesa vuelve a `libre`
          x-inertia-component: Mesas/Index
        "422":
          description: Monto no cubre el total de la orden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /reservas:
    get:
      summary: Calendario de reservas del día (US-4.2)
      responses:
        "200":
          description: Componente de calendario
          x-inertia-component: Reservas/Index
    post:
      summary: Crear reserva (US-4.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, customer_phone, party_size, reserved_at]
              properties:
                customer_name: { type: string }
                customer_phone: { type: string }
                party_size: { type: integer, minimum: 1 }
                reserved_at: { type: string, format: date-time }
                table_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Reserva creada
          x-inertia-component: Reservas/Index
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /menu:
    get:
      summary: Gestión de menú — listar platillos (US-6.1)
      responses:
        "200":
          description: Componente de gestión de menú
          x-inertia-component: Menu/Index
    post:
      summary: Crear platillo (US-6.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, price]
              properties:
                name: { type: string }
                category: { type: string }
                price: { type: number, format: decimal }
      responses:
        "200":
          x-inertia-component: Menu/Index
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /staff:
    get:
      summary: Gestión de staff — listar cuentas (US-6.2)
      description: Solo accesible a role=admin.
      responses:
        "200":
          x-inertia-component: Staff/Index
    post:
      summary: Crear cuenta de staff con rol (US-6.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                role: { type: string, enum: [admin, mesero, cocina] }
      responses:
        "200":
          x-inertia-component: Staff/Index
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /inventario:
    get:
      summary: Lista de insumos y stock (US-5.1, Should)
      responses:
        "200":
          x-inertia-component: Inventario/Index

  /inventario/{item}/ajustar:
    post:
      summary: Registrar entrada/salida manual de un insumo (US-5.2, Should)
      parameters:
        - name: item
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, quantity]
              properties:
                type: { type: string, enum: [entrada, salida] }
                quantity: { type: number, format: decimal }
                note: { type: string, nullable: true }
      responses:
        "200":
          x-inertia-component: Inventario/Index
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
