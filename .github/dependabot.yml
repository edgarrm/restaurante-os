version: 2

# Cooldowns mirror the `min-release-age` quarantine in .npmrc: a freshly
# published version is the highest-risk version. Dependabot *security* updates
# ignore cooldown, so advisories still land immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      # Grouped so review effort goes into reading one diff per area rather
      # than rubber-stamping many small bumps.
      eslint-prettier:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"
          - "prettier*"
      vite-build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "laravel-vite-plugin"
          - "@laravel/vite-plugin-*"
          - "lightningcss*"
          - "@rollup/*"
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@inertiajs/*"
          - "reka-ui"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "prettier-plugin-tailwindcss"
          - "tw-animate-css"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "inertiajs/*"
      symfony:
        patterns:
          - "symfony/*"
      dev-tooling:
        patterns:
          - "pestphp/*"
          - "phpunit/*"
          - "phpstan/*"
          - "larastan/*"
          - "mockery/*"
          - "nunomaduro/*"
          - "fakerphp/*"
